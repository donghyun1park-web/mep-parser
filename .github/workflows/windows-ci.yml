name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-test:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up locked Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12.10'
          architecture: 'x64'

      - name: Verify lock files before environment creation
        shell: pwsh
        run: python -B -m toolchain_lock --lock toolchain.lock.json --requirements-lock requirements-dev.lock

      - name: Create authenticated locked test environment
        shell: pwsh
        run: |
          & scripts/bootstrap_test_env.ps1 `
            -PythonExe (Get-Command python).Source `
            -EnvironmentPath '.venv-ci' `
            -LockPath 'toolchain.lock.json' `
            -RequirementsLock 'requirements-dev.lock'

      - name: Verify locked environment identity
        shell: pwsh
        run: |
          $python = '.venv-ci\Scripts\python.exe'
          $identity = (& $python -c "import platform, sys; print(f'{sys.version_info.major}.{sys.version_info.minor}.{sys.version_info.micro}|{platform.architecture()[0]}')").Trim()
          if ($identity -ne '3.12.10|64bit') { throw "PYTHON_IDENTITY_MISMATCH:expected=3.12.10|64bit actual=$identity" }

          $pipVersion = ((& $python -m pip --version).Trim() -split '\s+')[1]
          if ($pipVersion -ne '25.1.1') { throw "PIP_IDENTITY_MISMATCH:expected=25.1.1 actual=$pipVersion" }

          $pytestVersion = (& $python -c "import pytest; print(pytest.__version__)").Trim()
          if ($pytestVersion -ne '8.3.5') { throw "PYTEST_IDENTITY_MISMATCH:expected=8.3.5 actual=$pytestVersion" }

      - name: Run full test suite
        shell: pwsh
        run: |
          & .\.venv-ci\Scripts\python.exe -B -m pytest -q tests --junitxml=windows-ci-junit.xml

      - name: Upload Windows CI JUnit result
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-ci-junit
          path: windows-ci-junit.xml
          if-no-files-found: error
          retention-days: 14
